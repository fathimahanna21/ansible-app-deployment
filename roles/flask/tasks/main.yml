---
- name: Install required system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Flask application directory
  ansible.builtin.file:
    path: /opt/flask-app
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv /opt/flask-app/venv
    creates: /opt/flask-app/venv/bin/activate

- name: Copy Flask application files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app-source/flask/"
    dest: /opt/flask-app/
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: preserve
  notify: Restart Flask

- name: Install Flask dependencies
  ansible.builtin.pip:
    requirements: /opt/flask-app/requirements.txt
    virtualenv: /opt/flask-app/venv

- name: Deploy Flask systemd service
  ansible.builtin.template:
    src: flask.service.j2
    dest: /etc/systemd/system/flask-app.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Flask

- name: Enable and start Flask
  ansible.builtin.systemd:
    name: flask-app
    state: started
    enabled: true
    daemon_reload: true
