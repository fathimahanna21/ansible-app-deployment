---
- name: Install Node.js and npm
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Node.js application directory
  ansible.builtin.file:
    path: /opt/node-app
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy Node.js application files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app-source/node/"
    dest: /opt/node-app/
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: preserve
  notify: Restart Node

- name: Install Node.js dependencies
  ansible.builtin.command:
    cmd: npm install --omit=dev
    chdir: /opt/node-app
    creates: /opt/node-app/node_modules/express/package.json

- name: Deploy Node.js systemd service
  ansible.builtin.template:
    src: node.service.j2
    dest: /etc/systemd/system/node-app.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Node

- name: Enable and start Node.js
  ansible.builtin.systemd:
    name: node-app
    state: started
    enabled: true
    daemon_reload: true
